<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <link rel="canonical" href="https://<username>.github.io/<new-repo-name>/">
  <meta http-equiv="refresh" content="0; url=https://<username>.github.io/<new-repo-name>/">
  <script>
    const newBase = "https://<username>.github.io/<new-repo-name>";
    const oldPrefix = "/<old-repo-name>";
    let path = window.location.pathname;
    if (path.startsWith(oldPrefix)) {
      path = path.slice(oldPrefix.length);
    }
    window.location.replace(newBase + path + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>This page has moved. If you are not redirected automatically, <a href="https://<username>.github.io/<new-repo-name>/">click here</a>.</p>
</body>
</html>
